<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抽屉工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233377FF'/%3E%3Cpath d='M10 9h12v14l-6-4-6 4z' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF;
  --ink:#1F2329; --ink-soft:#51565F; --ink-faint:#8F959E;
  --line:#E5E8EF; --line-strong:#D5DAE3;
  --blue:#3377FF; --blue-deep:#1F5FE0; --blue-soft:#EDF3FF; --blue-ghost:rgba(51,119,255,.10);
  --amber:#FF8800; --amber-deep:#D97000; --amber-soft:#FFF4E8;
  --danger:#E54545; --danger-soft:#FDEBEB;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono:"SF Mono",ui-monospace,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
::selection{background:rgba(51,119,255,.18)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
input,textarea,select{font-family:inherit;color:var(--ink)}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}

/* ---------- 布局 ---------- */
.layout{display:flex;gap:14px;align-items:flex-start;max-width:1560px;margin:0 auto;padding:14px 16px 40px}
.main-col{flex:1;min-width:0}

/* ---------- 侧栏 ---------- */
.side{position:sticky;top:14px;flex:0 0 248px;width:248px;max-height:calc(100vh - 28px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 1px 2px rgba(31,35,41,.04),0 8px 24px rgba(31,35,41,.05);
  padding:14px 10px 12px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px}
.logo{width:38px;height:38px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(135deg,#4D8BFF,#3377FF);box-shadow:0 4px 10px rgba(51,119,255,.35)}
.brand-text{min-width:0}
.brand-text h1{margin:0;font-size:15px;line-height:1.2}
.brand-sub{display:flex;gap:5px;align-items:center;margin-top:4px}
.brand-sub-plain{font-size:11.5px;color:var(--ink-faint)}
.brand-sub .dd-wrap{flex:1;min-width:0}
.mini{width:20px;height:20px;border-radius:5px;display:inline-grid;place-items:center;font-size:12px;color:var(--ink-faint);flex:0 0 auto}
.mini:hover{background:rgba(31,35,41,.08);color:var(--ink)}
.mini.danger:hover{background:var(--danger-soft);color:var(--danger)}

/* ---------- 通用下拉 ---------- */
.dd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:5px 9px;font-size:12.5px;color:var(--ink)}
.dd-btn:hover{border-color:var(--blue)}
.dd-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-car{color:var(--ink-faint);font-size:10px;flex:0 0 auto}
.dd-pop{position:fixed;z-index:1000;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 12px 32px rgba(31,35,41,.16);padding:4px;overflow:auto}
.dd-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;font-size:13px;cursor:pointer;white-space:nowrap}
.dd-item:hover{background:var(--blue-soft)}
.dd-item .ck{margin-left:auto;font-size:11px;visibility:hidden}
.dd-item.sel{color:var(--blue);font-weight:600}
.dd-item.sel .ck{visibility:visible}
.dd-item.amber{color:var(--amber-deep)}

/* ---------- 侧栏目录 ---------- */
#sideNav{display:flex;flex-direction:column;gap:1px}
.side-label{font-size:11px;color:var(--ink-faint);padding:8px 8px 2px;letter-spacing:.05em}
.side-item{position:relative;display:flex;align-items:center;gap:4px;
  padding:5px 8px 5px calc(8px + var(--depth,0)*14px);border-radius:8px;color:var(--ink-soft);font-size:13.5px}
.side-item:hover{background:#F2F4F8}
.side-item.sel,.side-item.sel:hover{background:var(--blue);color:#fff}
.si-tw{flex:0 0 16px}
.si-tw-btn{flex:0 0 16px;width:16px;height:18px;display:grid;place-items:center;color:var(--ink-faint);font-size:10px;border-radius:4px;transition:transform .15s}
.si-tw-btn.open{transform:rotate(90deg)}
.side-item.sel .si-tw-btn{color:rgba(255,255,255,.85)}
.si-ic{flex:0 0 20px;width:20px;height:20px;display:grid;place-items:center;color:var(--ink-faint)}
.side-item.sel .si-ic{color:#fff}
.si-name{flex:1 1 auto;min-width:0;text-align:left;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si-count{flex:0 0 auto;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);background:#F2F4F8;border-radius:6px;padding:1px 6px;min-width:24px;text-align:center}
.side-item.sel .si-count{background:rgba(255,255,255,.22);color:#fff}
.si-ops{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:none;gap:1px;
  background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:1px;box-shadow:0 2px 8px rgba(31,35,41,.14);z-index:2}
.side-item:hover .si-ops,.side-item:focus-within .si-ops{display:flex}
.side-item.sel .si-ops{border-color:rgba(255,255,255,.35)}
.side-item.sel .mini{color:rgba(255,255,255,.85)}
.side-item.sel .mini:hover{background:rgba(255,255,255,.2);color:#fff}
.side-item.editing{display:block;padding-top:4px;padding-bottom:4px}
.side-editor{width:100%;border:1.5px solid var(--blue);border-radius:7px;padding:5px 8px;font-size:13px}
.side-newcat{margin:4px 4px 0;border:1.5px dashed var(--line-strong);border-radius:8px;padding:6px;color:var(--ink-soft);font-size:12.5px;text-align:center;transition:.15s}
.side-newcat:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-ghost)}
.side-stats{padding:9px 8px 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-faint);display:flex;gap:10px;flex-wrap:wrap}
.side-stats b{font-family:var(--font-mono);font-weight:600;color:var(--ink-soft)}
.side-hint{font-size:11px;color:var(--ink-faint);opacity:.85;padding:0 8px}
body.drag-src .side-item{outline:1.5px dashed var(--blue);outline-offset:-2px;cursor:copy}
.side-item.drop-over{background:var(--blue-soft)}

/* ---------- 工具条 ---------- */
.tools{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 14px;display:flex;gap:10px;align-items:center}
.searchbox{position:relative;flex:1 1 auto;max-width:480px}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-faint);pointer-events:none}
#q{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8.5px 12px 8.5px 34px;font-size:13.5px}
#q:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-ghost)}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;display:none}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-strong);
  color:var(--ink);border-radius:9px;padding:8px 12px;font-size:13px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--blue-deep);border-color:var(--blue-deep);color:#fff}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 12px 32px rgba(31,35,41,.14);padding:4px;min-width:224px;z-index:60}
.menu[hidden]{display:none}
.menu-item{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--ink)}
.menu-item:hover{background:#F2F4F8}
.menu-item.danger{color:var(--danger)}
.menu-item.danger:hover{background:var(--danger-soft)}

/* ---------- 主体 ---------- */
.empty{border:1.5px dashed var(--line-strong);border-radius:14px;padding:56px 20px;text-align:center;color:var(--ink-faint);margin-top:8px}
.empty-t{font-size:15px;color:var(--ink-soft);font-weight:600;margin-bottom:6px}
.empty-s{font-size:12.5px}
.ro-banner{background:var(--amber-soft);color:var(--amber-deep);border-radius:9px;padding:8px 12px;font-size:12px;margin:0 0 10px}
.ro-banner code{font-family:var(--font-mono);background:var(--surface);border-radius:4px;padding:0 4px}
.ro-banner[hidden]{display:none}
.linklike{color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.group{margin-bottom:20px}
.group-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;min-height:32px}
.gh-ic{width:28px;height:28px;border-radius:8px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:0 0 auto}
.gh-name{font-size:15.5px;font-weight:700;padding:2px 4px;border-radius:6px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh-name:hover{color:var(--blue)}
.gh-stats{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint)}
.gh-spacer{flex:1}
.gh-newsub{background:var(--amber-soft);color:var(--amber-deep);border-radius:7px;padding:4px 9px;font-size:12px;font-weight:600}
.gh-newsub:hover{background:#FFE9CE}
.gh-add{background:var(--blue-soft);color:var(--blue);border-radius:7px;padding:4px 10px;font-size:12px;font-weight:600}
.gh-add:hover{background:var(--blue-ghost)}
.sub-edit{border:1.5px solid var(--blue);border-radius:7px;padding:3px 8px;font-size:13px;width:170px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}

/* ---------- 卡片 ---------- */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;
  transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(31,35,41,.08);border-color:var(--line-strong)}
.card.enter{animation:cardIn .28s ease both;animation-delay:var(--d,0ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card.dragging{opacity:.45}
.open{position:absolute;inset:0;border-radius:10px;z-index:1}
.c-head{display:flex;gap:9px;align-items:flex-start}
.ic{width:30px;height:30px;border-radius:8px;background:#F2F4F8;display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
.ic img{width:18px;height:18px;display:block}
.ic-letter{color:#fff;font-family:var(--font-mono);font-weight:700;font-size:14px;box-shadow:inset 0 -2px 4px rgba(0,0,0,.18)}
.c-title{margin:2px 0 0;font-size:13.5px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;min-width:0}
.c-host{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);padding-left:39px;margin-top:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-tags{padding-left:39px;margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:10.5px;color:var(--ink-soft);background:#F2F4F8;border-radius:5px;padding:1.5px 6px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag-profile{background:var(--blue-soft);color:var(--blue);font-weight:600}
.c-note{font-size:12px;color:var(--ink-faint);margin-top:6px;padding-left:39px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-actions{position:absolute;top:8px;right:8px;display:none;gap:2px;z-index:3;background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:2px;box-shadow:0 4px 12px rgba(31,35,41,.12)}
.card:hover .card-actions,.card:focus-within .card-actions{display:flex}
.act{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:12px;color:var(--ink-soft)}
.act:hover{background:var(--blue-soft);color:var(--blue)}
.act.danger:hover{background:var(--danger-soft);color:var(--danger)}
.tab-badge{position:absolute;top:-7px;right:10px;z-index:2;color:#fff;font-size:10px;font-family:var(--font-mono);
  padding:2px 7px;border-radius:6px;max-width:72%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:opacity .15s;pointer-events:none}
.card-actions:hover ~ .tab-badge{opacity:0}
.card.folder{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:13px}
.card.folder:hover{border-color:var(--blue)}
.f-ic{width:34px;height:34px;border-radius:9px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.f-name{font-size:13.5px;font-weight:600}
.f-meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint)}

/* ---------- 页脚 ---------- */
.foot{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);margin-top:6px;padding-top:12px;
  font-size:11.5px;color:var(--ink-faint)}
.foot code{font-family:var(--font-mono);background:#F2F4F8;border-radius:4px;padding:0 4px}

/* ---------- 弹窗 ---------- */
dialog{border:none;padding:0;background:transparent;max-width:none;max-height:none}
dialog::backdrop{background:rgba(31,35,41,.40);backdrop-filter:blur(1.5px)}
.sheet{width:min(470px,92vw);max-height:86vh;overflow:auto;background:var(--surface);border-radius:14px;
  box-shadow:0 24px 64px rgba(31,35,41,.25);padding:18px}
.sheet h2{margin:0 0 14px;font-size:16px}
.field{margin-bottom:12px}
.field>label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);margin-bottom:5px}
.req{color:var(--blue);font-size:11px}
.field input,.field textarea{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:13.5px;background:var(--surface)}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-ghost)}
.field textarea{min-height:64px;resize:vertical}
.hint{font-size:11px;color:var(--ink-faint);margin-top:4px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.ac-pop{position:fixed;z-index:1000;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 12px 32px rgba(31,35,41,.16);padding:4px;max-height:240px;overflow:auto}
.ac-item{padding:7px 9px;border-radius:7px;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-item:hover{background:var(--blue-soft)}
.ac-new{color:var(--amber-deep);font-size:12px}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(8px);background:var(--surface);
  border-left:3px solid var(--blue);border-radius:9px;box-shadow:0 10px 28px rgba(31,35,41,.18);
  padding:9px 14px;font-size:13px;color:var(--ink);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
  z-index:2000;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.fade{opacity:0}

/* ---------- 响应式 ---------- */
@media (max-width:860px){
  .layout{flex-direction:column}
  .side{position:static;width:auto;flex:none;max-height:46vh}
  .grid{grid-template-columns:1fr}
  .foot{flex-direction:column;gap:4px}
  .tools{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .card:hover{transform:none}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">
      <span class="logo">
        <svg width="21" height="21" viewBox="0 0 32 32" fill="none"><path d="M10 9h12v14l-6-4-6 4z" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </span>
      <div class="brand-text">
        <h1>抽屉工作台</h1>
        <div class="brand-sub" id="profileBar"></div>
      </div>
    </div>
    <nav id="sideNav" aria-label="分类目录"></nav>
    <div class="side-stats" id="sideStats"></div>
    <div class="side-hint">按 Esc 清除搜索</div>
  </aside>

  <main class="main-col">
    <div class="tools">
      <div class="searchbox">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="输入关键词或网址即时搜索…" autocomplete="off">
      </div>
      <button class="btn" id="exportBtn" style="margin-left:auto">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
        导出分享
      </button>
      <div class="menu-wrap" id="settingsWrap">
        <button class="btn" id="settingsBtn" aria-haspopup="menu">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="var(--surface)"/><circle cx="15" cy="12" r="2" fill="var(--surface)"/><circle cx="7" cy="18" r="2" fill="var(--surface)"/></svg>
          设置
        </button>
        <div class="menu" id="settingsMenu" role="menu" hidden>
          <button class="menu-item" role="menuitem" data-act="import">导入 JSON</button>
          <button class="menu-item" role="menuitem" data-act="clear-cat" id="miClearCat" hidden>清空当前分类</button>
          <button class="menu-item danger" role="menuitem" data-act="clear-all">清空全部网址</button>
          <button class="menu-item danger" role="menuitem" data-act="clear-cats">清空所有分类（保留网址）</button>
          <button class="menu-item" role="menuitem" data-act="help">怎么同步 Chrome 收藏？</button>
        </div>
      </div>
      <button class="btn primary" id="addBtn">＋ 添加书签</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
    <div id="roBanner" class="ro-banner" hidden>正在浏览只读快照 —— 在项目目录运行 <code>node server.js</code> 后，刷新即可继续编辑</div>
    <div id="mainBody"></div>
    <footer class="foot">
      <span>数据存在本机 <code>抽屉工作台/data/links.json</code></span>
      <span>左侧目录可折叠、可拖卡片进去 · 点分组标题进入该分类</span>
    </footer>
  </main>
</div>

<dialog id="dlgLink">
  <form id="linkForm" class="sheet" novalidate>
    <h2 id="dlgLinkTitle">添加书签</h2>
    <div class="field"><label>网址 <span class="req">必填</span></label><input id="fUrl" placeholder="https://…" required></div>
    <div class="field"><label>标题</label><input id="fTitle" placeholder="留空就用网址"></div>
    <div class="field"><label>分类</label><input id="fCat" autocomplete="off" placeholder="如：工作/前端"></div>
    <div class="field"><label>标签</label><input id="fTags" placeholder="逗号分隔，如：设计, 工具"></div>
    <div class="field"><label>备注</label><textarea id="fNote" placeholder="为什么收藏它？"></textarea></div>
    <div class="dlg-foot"><button type="button" class="btn" data-close>取消</button><button type="submit" class="btn primary" id="dlgLinkSubmit">收进抽屉</button></div>
  </form>
</dialog>

<dialog id="dlgProfile">
  <form id="profileForm" class="sheet" novalidate>
    <h2>重命名个人资料</h2>
    <div class="field"><label>新的资料名 <span class="req">必填</span></label><input id="fProfile" required placeholder="如：shoan-i18n"></div>
    <div class="hint">该资料下已有的收藏会一起迁到新名下。</div>
    <div class="dlg-foot"><button type="button" class="btn" data-close>取消</button><button type="submit" class="btn primary">改名</button></div>
  </form>
</dialog>

<dialog id="dlgExport">
  <div class="sheet">
    <h2>导出分享</h2>
    <div class="field"><label>资料</label><div id="expProfileDd"></div></div>
    <div class="field"><label>分类</label><div id="expCatDd"></div></div>
    <div class="hint" id="expStats"></div>
    <div class="dlg-foot"><button type="button" class="btn" id="expCancel">取消</button><button type="button" class="btn primary" id="expGo">导出</button></div>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
/* ================= 工具 ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const UNC = '未分类';

/* 混合模式：页面托管在 GitHub Pages 等远程地址时，API 仍指向本机服务。
   可用 localStorage['nav.apiBase'] 覆盖（如服务改了端口或跑在局域网另一台机器）。 */
const LOCAL_HOSTS = new Set(['127.0.0.1', 'localhost', '::1', '']);
const API_BASE = localStorage.getItem('nav.apiBase') ||
  (LOCAL_HOSTS.has(location.hostname) ? '' : 'http://127.0.0.1:4780');
const SNAPSHOT_URL = 'data.snapshot.json';

const CAT_COLORS = ['#3377FF','#FF8800','#00B8A9','#7B61FF','#F76964','#2EA84F','#B8871B'];
const SITE_COLORS = ['#3377FF','#FF8800','#00B8A9','#7B61FF','#F76964','#2EA84F','#B8871B','#0EA5E9','#E8559E'];

const ICON = {
  grid: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  inbox: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>',
  folder: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
};

/* ================= 状态 ================= */
const state = {
  links: [], categories: [],
  cat: '全部', q: '', animate: false, readonly: false,
  profile: localStorage.getItem('nav.profile') || '全部',
};
const collapsed = new Set();      // 折叠的分类路径
let editing = null;               // {mode:'new'} | {mode:'rename', path}
let editId = null;                // 编辑书签 id
let profileDd = null;
let expProfileDd = null, expCatDd = null;

const catOf = (l) => (l.category || '').trim() || UNC;
const profileOf = (l) => String(l.profile || '').trim() || '默认';
const inProfile = (l) => state.profile === '全部' || profileOf(l) === state.profile;
const scoped = () => state.links.filter(inProfile);
const inCat = (c, cat) => c === cat || String(c || '').startsWith(cat + '/');
const lastSeg = (p) => p.includes('/') ? p.slice(p.lastIndexOf('/') + 1) : p;
const parentOf = (p) => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : null;
const zhSort = (a, b) => a.localeCompare(b, 'zh');

function profilesList() {
  const m = new Map();
  for (const l of state.links) {
    const p = profileOf(l);
    m.set(p, (m.get(p) || 0) + 1);
  }
  return [...m].map(([name, count]) => ({ name, count }))
    .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'zh'));
}

function hostOf(url) {
  try { return new URL(url).hostname; } catch { return ''; }
}

function normalizeUrl(raw) {
  let s = String(raw == null ? '' : raw).trim();
  if (!s) return null;
  if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
  let u;
  try { u = new URL(s); } catch { return null; }
  if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
  u.hostname = u.hostname.toLowerCase();
  let out = u.toString();
  const i = out.indexOf('#');
  if (i !== -1) out = out.slice(0, i);
  if (u.pathname === '/') out = out.replace(/\/(?=\?|$)/, '');
  return out;
}

function hostColor(host) {
  let h = 0;
  const s = host || '?';
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return SITE_COLORS[h % SITE_COLORS.length];
}

function topList() {
  const tops = new Set([UNC]);
  for (const c of state.categories) tops.add(c.split('/')[0]);
  const rest = [...tops].filter((t) => t !== UNC).sort(zhSort);
  return [UNC, ...rest];
}

function colorFor(cat) {
  const tops = topList();
  const i = tops.indexOf(String(cat).split('/')[0]);
  return CAT_COLORS[(i < 0 ? 0 : i) % CAT_COLORS.length];
}

/* 分类计数：categories 全部置 0 + scoped links 累加；保证 未分类 键存在 */
function catCounts() {
  const m = new Map();
  for (const c of state.categories) m.set(c, 0);
  for (const l of scoped()) {
    const c = catOf(l);
    m.set(c, (m.get(c) || 0) + 1);
  }
  if (!m.has(UNC)) m.set(UNC, 0);
  return m;
}
function globalCatCounts() {
  const m = new Map();
  for (const l of state.links) {
    const c = catOf(l);
    m.set(c, (m.get(c) || 0) + 1);
  }
  return m;
}

/* ================= API ================= */
async function api(method, path, body) {
  if (method !== 'GET' && state.readonly) {
    toast('只读快照：启动本地服务 node server.js 后才能修改');
    const err = new Error('readonly');
    err.readonly = true;
    throw err;
  }
  const r = await fetch(API_BASE + path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  let j = null;
  try { j = await r.json(); } catch {}
  if (!r.ok) {
    const err = new Error((j && j.error) || 'HTTP ' + r.status);
    err.status = r.status;
    throw err;
  }
  return j;
}

/* ================= Toast ================= */
let toastTimer1 = null, toastTimer2 = null;
function toast(msg) {
  const t = $('#toast');
  clearTimeout(toastTimer1); clearTimeout(toastTimer2);
  t.textContent = msg;
  t.classList.remove('fade');
  t.classList.add('show');
  toastTimer1 = setTimeout(() => {
    t.classList.add('fade');
    toastTimer2 = setTimeout(() => t.classList.remove('show'), 220);
  }, 2200);
}

/* ================= 通用下拉 ================= */
function createDropdown(cfg) {
  const wrap = document.createElement('div');
  wrap.className = 'dd-wrap';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'dd-btn';
  btn.setAttribute('aria-haspopup', 'listbox');
  const lbl = document.createElement('span');
  lbl.className = 'dd-lbl';
  const car = document.createElement('span');
  car.className = 'dd-car';
  car.textContent = '▾';
  btn.append(lbl, car);
  wrap.appendChild(btn);
  let items = cfg.items || [];
  let value = cfg.value;
  let pop = null;
  const labelOf = (it) => it.count != null ? `${it.label} (${it.count})` : it.label;
  const current = () => items.find((i) => i.value === value) || items[0];
  function paint() {
    const it = current();
    lbl.textContent = it ? labelOf(it) : '';
  }
  function close() {
    if (!pop) return;
    pop.remove(); pop = null;
    document.removeEventListener('mousedown', out, true);
    window.removeEventListener('scroll', close, true);
  }
  function out(e) {
    if (pop && !pop.contains(e.target) && !btn.contains(e.target)) close();
  }
  function open() {
    if (pop) return close();
    pop = document.createElement('div');
    pop.className = 'dd-pop';
    pop.setAttribute('role', 'listbox');
    for (const it of items) {
      const o = document.createElement('div');
      o.className = 'dd-item' + (it.value === value ? ' sel' : '') + (it.className ? ' ' + it.className : '');
      o.setAttribute('role', 'option');
      o.setAttribute('aria-selected', String(it.value === value));
      o.innerHTML = `<span>${esc(labelOf(it))}</span><span class="ck">✓</span>`;
      o.addEventListener('mousedown', (e) => e.preventDefault());
      o.addEventListener('click', () => {
        value = it.value;
        paint(); close();
        if (cfg.onChange) cfg.onChange(value);
      });
      pop.appendChild(o);
    }
    document.body.appendChild(pop);
    const r = btn.getBoundingClientRect();
    pop.style.left = r.left + 'px';
    pop.style.top = (r.bottom + 6) + 'px';
    pop.style.minWidth = r.width + 'px';
    pop.style.maxHeight = Math.max(140, window.innerHeight - r.bottom - 14) + 'px';
    document.addEventListener('mousedown', out, true);
    window.addEventListener('scroll', close, true);
  }
  btn.addEventListener('click', open);
  btn.addEventListener('keydown', (e) => { if (e.key === 'Escape') { close(); e.stopPropagation(); } });
  paint();
  (cfg.mount || document.body).appendChild(wrap);
  return {
    el: wrap,
    get: () => value,
    set(items2, value2) { items = items2; value = value2; paint(); },
    close,
  };
}

/* ================= 渲染：侧栏 ================= */
function renderProfileBar() {
  const bar = $('#profileBar');
  if (profileDd) { profileDd.close(); profileDd = null; }
  const ps = profilesList();
  if (!ps.length) {
    bar.innerHTML = `<span class="brand-sub-plain">全部书签 · 本机空间</span>`;
    return;
  }
  bar.innerHTML = `<div id="profileDdMount"></div><button id="profRen" class="mini" title="重命名当前个人资料"${state.profile === '全部' ? ' hidden' : ''}>✎</button>`;
  profileDd = createDropdown({
    mount: $('#profileDdMount'),
    items: [{ value: '全部', label: '全部资料', count: state.links.length }, ...ps.map((p) => ({ value: p.name, label: p.name, count: p.count }))],
    value: state.profile,
    onChange: switchProfile,
  });
  $('#profRen').addEventListener('click', openProfileDialog);
}

function switchProfile(v) {
  state.profile = v;
  localStorage.setItem('nav.profile', v);
  state.cat = '全部';
  state.animate = true;
  render();
}

function sideRow({ path, name, icon, count, sel, leaf, placeholder }) {
  const isSpecial = placeholder; // 全部/未分类：无 ✎/✕
  let tw;
  if (leaf) tw = '<span class="si-tw"></span>';
  else tw = `<button class="si-tw-btn${collapsed.has(path) ? '' : ' open'}" data-tw="${esc(path)}" title="展开/收起「${esc(name)}」" aria-label="展开/收起「${esc(name)}」">▸</button>`;
  return `<div class="side-item${sel ? ' sel' : ''}" style="--depth:${path && path.includes('/') ? 0 : 0}" data-cat="${esc(path)}">
    ${tw}
    <span class="si-ic">${icon}</span>
    <button class="si-name" data-name="${esc(path)}">${esc(name)}</button>
    <span class="si-count">${count}</span>
    <span class="si-ops">${isSpecial ? '' : `<button class="mini" data-ren="${esc(path)}" title="重命名分类" aria-label="重命名分类「${esc(name)}」">✎</button><button class="mini danger" data-del="${esc(path)}" title="删除分类" aria-label="删除分类「${esc(name)}」">✕</button>`}</span>
  </div>`;
}

function editorRowHtml(depth, oldPath) {
  const isRename = !!oldPath;
  return `<div class="side-item editing" style="--depth:${depth}" data-editor="${esc(oldPath || '')}">
    <input class="side-editor" maxlength="30" data-editor-input
      placeholder="${isRename ? '' : '新分类名，可用 / 表示层级'}" value="${isRename ? esc(lastSeg(oldPath)) : ''}">
  </div>`;
}

function buildTree(cats, counts) {
  const root = { children: new Map() };
  for (const c of cats) {
    const parts = c.split('/');
    let node = root;
    parts.forEach((seg, i) => {
      const path = parts.slice(0, i + 1).join('/');
      if (!node.children.has(seg)) node.children.set(seg, { seg, path, own: counts.get(path) || 0, children: new Map() });
      node = node.children.get(seg);
    });
  }
  const calc = (n) => { n.total = n.own || 0; for (const ch of n.children.values()) n.total += calc(ch); return n.total; };
  const list = [...root.children.values()].sort((a, b) => zhSort(a.seg, b.seg));
  list.forEach(calc);
  return list;
}

function renderTreeHtml(nodes, depth) {
  let html = '';
  const sorted = [...nodes].sort((a, b) => zhSort(a.seg, b.seg));
  for (const n of sorted) {
    const isLeaf = n.children.size === 0;
    if (editing && editing.mode === 'rename' && editing.path === n.path) {
      html += editorRowHtml(depth, n.path);
      continue;
    }
    html += sideRow({ path: n.path, name: n.seg, icon: ICON.folder, count: n.total, sel: state.cat === n.path, leaf: isLeaf });
    if (!isLeaf && !collapsed.has(n.path)) html += renderTreeHtml([...n.children.values()], depth + 1);
  }
  return html;
}

function renderNav() {
  const nav = $('#sideNav');
  const counts = catCounts();
  const gcounts = globalCatCounts();
  const uncCount = counts.get(UNC) || 0;
  const showUnc = uncCount > 0 || state.cat === UNC;

  let html = sideRow({ path: '__all', name: '全部书签', icon: ICON.grid, count: scoped().length, sel: state.cat === '全部', leaf: true, placeholder: true });
  if (showUnc) html += sideRow({ path: UNC, name: UNC, icon: ICON.inbox, count: uncCount, sel: state.cat === UNC, leaf: true, placeholder: true });

  // 可见分类：隐藏「其它资料有收藏、本资料没有」的；未分类 走独立行
  let cats = state.categories.filter((c) => c !== UNC)
    .filter((c) => !((gcounts.get(c) || 0) > 0 && (counts.get(c) || 0) === 0))
    .sort(zhSort);
  if (cats.length) html += `<div class="side-label">分类目录</div>`;
  html += renderTreeHtml(buildTree(cats, counts), 0);

  if (editing && editing.mode === 'new') html += editorRowHtml(0, '');
  else html += `<button class="side-newcat" id="newCatBtn">＋ 新建分类</button>`;
  nav.innerHTML = html;
  wireNavEditor();
}

function wireNavEditor() {
  const inp = $('#sideNav [data-editor-input]');
  if (!inp) return;
  const oldPath = $('#sideNav [data-editor]').dataset.editor;
  const isRename = !!oldPath;
  inp.focus();
  if (isRename) inp.select();
  let done = false;
  const finish = (commit) => {
    if (done) return;
    done = true;
    const v = inp.value.trim();
    if (commit && v && (!isRename || v !== lastSeg(oldPath))) {
      if (isRename) renameCategory(oldPath, v);
      else createCategory(v);
    } else {
      editing = null;
      renderNav();
    }
  };
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  inp.addEventListener('blur', () => finish(true));
}

function renderStats() {
  const ps = profilesList();
  const n = scoped().length;
  const coll = state.profile === '全部'
    ? `收藏 <b>${n}</b>`
    : `收藏 <b>本资料${n} / 总${state.links.length}</b>`;
  $('#sideStats').innerHTML = `${coll}<span>资料 <b>${ps.length || 1}</b></span><span>分类 <b>${state.categories.length}</b></span>`;
}

/* ================= 渲染：主区 ================= */
function letterOf(host) {
  const s = (host || '').replace(/^www\./, '');
  return (s[0] || '#').toUpperCase();
}

function cardHtml(l, i) {
  const host = hostOf(l.url);
  const delay = Math.min(i * 24, 300);
  const title = l.title || l.url;
  const t = esc(title);
  const tags = l.tags || [];
  const showProfile = state.profile === '全部' && profilesList().length > 1;
  const searching = !!state.q.trim();
  const badge = searching ? `<span class="tab-badge" style="background:${colorFor(catOf(l))}">${esc(catOf(l))}</span>` : '';
  return `<article class="card${state.animate ? ' enter' : ''}" style="--d:${delay}ms" data-id="${esc(l.id)}">
    <a class="open" href="${esc(l.url)}" target="_blank" rel="noopener" draggable="false" aria-label="打开 ${t}"></a>
    <div class="c-head"><span class="ic" data-host="${esc(host)}" data-letter="${esc(letterOf(host))}"></span><h3 class="c-title" title="${t}">${t}</h3></div>
    <div class="c-host" title="${esc(l.url)}">${esc(host)}</div>
    ${showProfile || tags.length ? `<div class="c-tags">${showProfile ? `<span class="tag tag-profile" title="来自个人资料">${esc(profileOf(l))}</span>` : ''}${tags.map((x) => `<span class="tag">${esc(x)}</span>`).join('')}</div>` : ''}
    ${l.note ? `<div class="c-note">${esc(l.note)}</div>` : ''}
    <div class="card-actions">
      <button class="act" data-act="copy" title="复制网址" aria-label="复制「${t}」的网址">⧉</button>
      <button class="act" data-act="edit" title="编辑" aria-label="编辑「${t}」">✎</button>
      <button class="act danger" data-act="del" title="删除" aria-label="删除「${t}」">✕</button>
    </div>
    ${badge}
  </article>`;
}

function folderHtml(path) {
  const items = scoped().filter((l) => inCat(catOf(l), path));
  const dirs = state.categories.filter((c) => inCat(c, path) && c !== path);
  return `<button class="card folder${state.animate ? ' enter' : ''}" data-folder="${esc(path)}">
    <span class="f-ic">${ICON.folder}</span>
    <span class="f-name">${esc(lastSeg(path))}</span>
    <span class="f-meta">${items.length} 书签 · ${dirs.length} 目录</span>
  </button>`;
}

function groupHtml(name, catPath, links, dirs) {
  let head = '';
  if (catPath !== null) {
    const editable = !!catPath && catPath !== UNC;
    head = `<div class="group-head" data-gh="${esc(catPath)}">
      <span class="gh-ic">${ICON.folder}</span>
      <button class="gh-name" data-enter="${esc(catPath)}">${esc(name)}</button>
      <span class="gh-ops" style="display:inline-flex;gap:2px">
        ${editable ? `<button class="mini" data-gh-ren title="重命名分类">✎</button><button class="mini danger" data-gh-del title="删除分类">✕</button>` : ''}
      </span>
      <span class="gh-stats">${links.length} 书签 · ${dirs.length} 目录</span>
      <span class="gh-spacer"></span>
      ${editable ? `<button class="gh-newsub" data-gh-new>＋ 新建子分类</button>` : ''}
      <button class="gh-add" data-gh-add>添加书签</button>
    </div>`;
  }
  const cards = links.map((l, i) => cardHtml(l, i)).join('') + dirs.map((d) => folderHtml(d)).join('');
  return `<section class="group">${head}<div class="grid">${cards}</div></section>`;
}

function emptyHtml(kind) {
  if (kind === 1) return `<div class="empty"><div class="empty-t">抽屉还是空的。</div><div class="empty-s">点右上角「添加书签」把第一个链接放进来。</div></div>`;
  if (kind === 2) return `<div class="empty"><div class="empty-t">「${esc(state.profile)}」这个个人资料下还没有收藏。</div><div class="empty-s">在 Chrome 对应的个人资料里装上扩展并起同名，收藏就会自动流进来。</div></div>`;
  return `<div class="empty"><div class="empty-t">没有符合条件的条目。</div><div class="empty-s">换个关键词，或切回「全部」看看。</div></div>`;
}

function errorHtml() {
  return `<div class="empty"><div class="empty-t">连接不上本地服务。</div><div class="empty-s">确认终端里 <code>node server.js</code> 还开着，然后 <button class="linklike" id="retryBtn">重试</button>。</div></div>`;
}

function matchLink(l, q) {
  if (!q) return true;
  const hay = [l.title, l.url, l.note, (l.tags || []).join(' '), catOf(l)].join('\n').toLowerCase();
  return hay.includes(q);
}

function renderMain() {
  const body = $('#mainBody');
  if (!state.links.length) { body.innerHTML = emptyHtml(1); return; }
  if (state.profile !== '全部' && scoped().length === 0) { body.innerHTML = emptyHtml(2); return; }
  const q = state.q.trim().toLowerCase();
  const items = scoped().filter((l) => matchLink(l, q));
  if (q && !items.length) { body.innerHTML = emptyHtml(3); return; }

  let html = '';
  if (q) {
    html = `<div class="group"><div class="grid">${items.map((l, i) => cardHtml(l, i)).join('')}</div></div>`;
  } else if (state.cat === UNC) {
    const links = items.filter((l) => catOf(l) === UNC);
    html = groupHtml(UNC, null, links, []);
  } else if (state.cat === '全部') {
    const tops = new Set(items.map((l) => {
      const c = catOf(l);
      return c === UNC ? UNC : c.split('/')[0];
    }));
    const sorted = [...tops].sort((a, b) => (a === UNC ? -1 : b === UNC ? 1 : zhSort(a, b)));
    html = sorted.map((top) => {
      const links = items.filter((l) => catOf(l) === top);
      const dirs = state.categories.filter((c) => parentOf(c) === top).sort(zhSort);
      return groupHtml(top, top, links, dirs);
    }).join('');
  } else {
    const cat = state.cat;
    const links = items.filter((l) => catOf(l) === cat);
    const dirs = state.categories.filter((c) => parentOf(c) === cat).sort(zhSort);
    html = groupHtml(lastSeg(cat), cat, links, dirs);
  }
  body.innerHTML = `<section id="content" aria-live="polite">${html}</section>`;
  setupIcons(body);
}

/* favicon 渐进显示：字母色块立即出现（毫秒级），真实图标由 ①直连 ②代理 并行竞速，
   谁先成功就替换字母；两路都失败则保持字母。结果存会话内缓存，重渲染秒出。 */
const iconCache = new Map();   // host -> {kind:'img', url} | {kind:'letter'}
const iconResolving = new Set();

function applyLetter(el, host) {
  el.classList.add('ic-letter');
  el.style.background = hostColor(host);
  el.textContent = el.dataset.letter || '?';
}

function applyImg(el, host, url) {
  el.classList.remove('ic-letter');
  el.style.background = '';
  el.classList.add('ic-img');
  el.textContent = '';
  const img = new Image();
  img.width = 18; img.height = 18; img.alt = '';
  img.src = url;
  el.appendChild(img);
}

function resolveIcon(host) {
  if (iconCache.has(host) || iconResolving.has(host)) return;
  iconResolving.add(host);
  let pending = 2;
  const finish = (kind, url) => {
    if (iconCache.has(host)) return; // 另一路已抢先解决
    iconCache.set(host, kind === 'img' ? { kind: 'img', url } : { kind: 'letter' });
    iconResolving.delete(host);
    // 刷新页面上同一 host 的所有图标位
    $$('.ic[data-host]').forEach((el) => {
      if (el.dataset.host !== host || !el.isConnected) return;
      if (kind === 'img') applyImg(el, host, url);
    });
  };
  const fail = () => { pending -= 1; if (pending <= 0) finish('letter'); };
  // ① 直连 favicon.ico（超时只是放弃升级，不影响已显示的字母块）
  const probe = new Image();
  const probeTimer = setTimeout(() => { probe.src = ''; fail(); }, 4000);
  probe.onload = () => { clearTimeout(probeTimer); finish('img', probe.src); };
  probe.onerror = () => { clearTimeout(probeTimer); fail(); };
  probe.src = `https://${host}/favicon.ico`;
  // ② 服务端代理（与直连并行）
  const proxyTimer = setTimeout(fail, 7000);
  fetch(`${API_BASE}/api/favicon?host=${encodeURIComponent(host)}`)
    .then((r) => {
      clearTimeout(proxyTimer);
      if (!r.ok) return fail();
      const ct = (r.headers.get('content-type') || '').toLowerCase();
      if (!ct.startsWith('image/')) return fail();
      return r.blob().then((b) => finish('img', URL.createObjectURL(b)));
    })
    .catch(() => { clearTimeout(proxyTimer); fail(); });
}

function setupIcons(root) {
  $$('.ic[data-host]', root).forEach((el) => {
    const host = el.dataset.host;
    const cached = iconCache.get(host);
    if (cached && cached.kind === 'img') { applyImg(el, host, cached.url); return; }
    applyLetter(el, host); // 立即显示，后续异步升级为真实图标
    if (host) resolveIcon(host);
  });
}

function render() {
  renderProfileBar();
  renderNav();
  renderStats();
  renderMain();
  $('#miClearCat').hidden = !(state.cat !== '全部' && state.cat !== UNC);
  $('#roBanner').hidden = !state.readonly;
  state.animate = false;
}

/* ================= 加载 ================= */
function applyData(j) {
  state.links = (j.links || []).slice()
    .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
  state.categories = j.categories || [];
  if (state.profile !== '全部' && !profilesList().some((p) => p.name === state.profile)) {
    state.profile = '全部';
    localStorage.setItem('nav.profile', '全部');
  }
  if (state.cat !== '全部' && state.cat !== UNC && !state.categories.includes(state.cat)) state.cat = '全部';
}

async function load() {
  try {
    const j = await api('GET', '/api/links');
    applyData(j);
    state.readonly = false;
    state.animate = true;
    render();
  } catch {
    /* 本地服务不可达 → 回退到同源只读快照（GitHub Pages / 分享场景） */
    try {
      const r = await fetch(SNAPSHOT_URL);
      if (!r.ok) throw new Error('no snapshot');
      applyData(await r.json());
      state.readonly = true;
      state.animate = true;
      render();
      toast('本地服务未启动，正在浏览只读快照');
    } catch {
      state.readonly = false;
      $('#roBanner').hidden = true;
      $('#mainBody').innerHTML = errorHtml();
    }
  }
}

/* ================= 分类操作 ================= */
async function createCategory(v) {
  try {
    await api('POST', '/api/categories', { name: v });
    if (!state.categories.includes(v)) state.categories.push(v);
    editing = null;
    toast(`已创建分类「${v}」`);
    state.animate = true;
    render();
  } catch (e) {
    if (e.readonly) { editing = null; render(); return; }
    editing = null;
    if (e.status === 409) toast('分类已存在');
    else toast('保存失败，检查本地服务');
    render();
  }
}

async function renameCategory(oldPath, newLast) {
  const prefix = oldPath.includes('/') ? oldPath.slice(0, oldPath.lastIndexOf('/') + 1) : '';
  const newPath = prefix + newLast;
  try {
    await api('PUT', '/api/categories/' + encodeURIComponent(oldPath), { name: newPath });
    state.categories = state.categories.map((c) => (inCat(c, oldPath) ? newPath + c.slice(oldPath.length) : c));
    for (const l of state.links) if (inCat(catOf(l), oldPath)) l.category = newPath + l.category.slice(oldPath.length);
    if (inCat(state.cat, oldPath)) state.cat = newPath + state.cat.slice(oldPath.length);
    editing = null;
    toast(`已重命名为「${newPath}」`);
    state.animate = true;
    render();
  } catch (e) {
    if (e.readonly) { editing = null; render(); return; }
    editing = null;
    if (e.status === 409) toast(`分类「${newPath}」已存在`);
    else toast('保存失败，检查本地服务');
    render();
  }
}

async function deleteCategory(path) {
  const n = scoped().filter((l) => inCat(catOf(l), path)).length;
  const msg = n > 0 ? `删除分类「${path}」？其中 ${n} 个链接会移到「${UNC}」。` : `删除分类「${path}」？`;
  if (!confirm(msg)) return;
  try {
    await api('DELETE', '/api/categories/' + encodeURIComponent(path));
    state.categories = state.categories.filter((c) => !inCat(c, path));
    for (const l of state.links) if (inCat(catOf(l), path)) l.category = UNC;
    if (state.cat !== '全部' && inCat(state.cat, path)) state.cat = '全部';
    toast(`已删除分类「${path}」`);
    state.animate = true;
    render();
  } catch (e) {
    if (e && e.readonly) return;
    toast('删除失败，检查本地服务');
  }
}

async function createSubCategory(parentPath, name) {
  const full = parentPath + '/' + name;
  try {
    await api('POST', '/api/categories', { name: full });
    if (!state.categories.includes(full)) state.categories.push(full);
    state.cat = full;
    toast(`已创建分类「${full}」`);
    state.animate = true;
    render();
  } catch (e) {
    if (e.readonly) { render(); return; }
    if (e.status === 409) toast('分类已存在');
    else toast('保存失败，检查本地服务');
    render();
  }
}

/* ================= 侧栏交互 ================= */
function wireNav() {
  const nav = $('#sideNav');
  nav.addEventListener('click', (e) => {
    const tw = e.target.closest('[data-tw]');
    if (tw) {
      const p = tw.dataset.tw;
      if (collapsed.has(p)) collapsed.delete(p); else collapsed.add(p);
      renderNav();
      return;
    }
    const nameBtn = e.target.closest('.si-name');
    if (nameBtn) {
      const p = nameBtn.dataset.name;
      state.cat = state.cat === p ? '全部' : p;
      state.q = '';
      $('#q').value = '';
      state.animate = true;
      render();
      return;
    }
    const ren = e.target.closest('[data-ren]');
    if (ren) { editing = { mode: 'rename', path: ren.dataset.ren }; renderNav(); return; }
    const del = e.target.closest('[data-del]');
    if (del) { deleteCategory(del.dataset.del); return; }
    if (e.target.closest('#newCatBtn')) { editing = { mode: 'new' }; renderNav(); return; }
  });

  /* 拖拽放置 */
  nav.addEventListener('dragover', (e) => {
    const row = e.target.closest('.side-item[data-cat]');
    if (!row || row.dataset.cat === '__all' || row.classList.contains('editing')) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    $$('.side-item.drop-over', nav).forEach((r) => r.classList.remove('drop-over'));
    row.classList.add('drop-over');
  });
  nav.addEventListener('dragleave', (e) => {
    const row = e.target.closest('.side-item');
    if (row && (!e.relatedTarget || !row.contains(e.relatedTarget))) row.classList.remove('drop-over');
  });
  nav.addEventListener('drop', async (e) => {
    const row = e.target.closest('.side-item[data-cat]');
    if (!row) return;
    e.preventDefault();
    row.classList.remove('drop-over');
    const target = row.dataset.cat;
    if (target === '__all' || target === state.cat) return;
    const id = e.dataTransfer.getData('text/plain');
    const link = state.links.find((l) => l.id === id);
    if (!link || catOf(link) === target) return;
    try {
      await api('PUT', '/api/links/' + id, { category: target });
      link.category = target;
      if (target !== UNC && !state.categories.includes(target)) state.categories.push(target);
      toast(`「${link.title || link.url}」已移到「${target}」`);
      state.animate = true;
      render();
    } catch (e) {
      if (e && e.readonly) return;
      toast('移动失败，检查本地服务');
    }
  });
}

/* 全局拖拽 */
function wireDrag() {
  document.addEventListener('dragstart', (e) => {
    const card = e.target.closest && e.target.closest('.card[data-id]');
    if (!card) return;
    e.dataTransfer.setData('text/plain', card.dataset.id);
    e.dataTransfer.effectAllowed = 'move';
    card.classList.add('dragging');
    document.body.classList.add('drag-src');
  });
  document.addEventListener('dragend', () => {
    $$('.card.dragging').forEach((c) => c.classList.remove('dragging'));
    document.body.classList.remove('drag-src');
    $$('.side-item.drop-over').forEach((r) => r.classList.remove('drop-over'));
  });
}

/* ================= 主区交互 ================= */
function startGroupRename(head, path) {
  const nameBtn = head.querySelector('.gh-name');
  if (!nameBtn) return;
  const input = document.createElement('input');
  input.className = 'sub-edit';
  input.maxLength = 60;
  input.value = lastSeg(path);
  input.setAttribute('aria-label', '重命名分类');
  nameBtn.replaceWith(input);
  input.focus();
  input.select();
  let done = false;
  const finish = (commit) => {
    if (done) return;
    done = true;
    const v = input.value.trim();
    if (commit && v && v !== lastSeg(path)) renameCategory(path, v);
    else render();
  };
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
}

function startGroupNewSub(head, path) {
  if (head.querySelector('[data-newsub-input]')) return;
  const input = document.createElement('input');
  input.className = 'sub-edit';
  input.placeholder = '子分类名，回车保存';
  input.maxLength = 30;
  input.setAttribute('data-newsub-input', '');
  head.appendChild(input);
  input.focus();
  let done = false;
  const finish = (commit) => {
    if (done) return;
    done = true;
    const v = input.value.trim();
    if (commit && v) createSubCategory(path, v);
    else render();
  };
  input.addEventListener('input', () => { input.value = input.value.replaceAll('/', '-'); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
}

async function copyUrl(link) {
  try {
    await navigator.clipboard.writeText(link.url);
    toast('网址已复制');
  } catch {
    toast('复制失败');
  }
}

async function handleCardAct(btn) {
  const card = btn.closest('.card[data-id]');
  const link = state.links.find((l) => l.id === card.dataset.id);
  if (!link) return;
  const act = btn.dataset.act;
  if (act === 'copy') return copyUrl(link);
  if (act === 'edit') return openLinkDialog(link);
  if (act === 'del') {
    if (!confirm(`从抽屉里删掉「${link.title || link.url}」？`)) return;
    try {
      await api('DELETE', '/api/links/' + link.id);
      state.links = state.links.filter((l) => l.id !== link.id);
      toast('已删除');
      state.animate = true;
      render();
    } catch {
      toast('删除失败，检查本地服务');
    }
  }
}

function wireMain() {
  const body = $('#mainBody');
  body.addEventListener('click', (e) => {
    if (e.target.closest('#retryBtn')) { load(); return; }
    const act = e.target.closest('.card[data-id] .act');
    if (act) { handleCardAct(act); return; }
    const folder = e.target.closest('[data-folder]');
    if (folder) {
      state.cat = folder.dataset.folder;
      state.q = '';
      $('#q').value = '';
      state.animate = true;
      render();
      return;
    }
    const enter = e.target.closest('[data-enter]');
    if (enter) {
      state.cat = enter.dataset.enter;
      state.animate = true;
      render();
      return;
    }
    const ghDel = e.target.closest('[data-gh-del]');
    if (ghDel) { deleteCategory(ghDel.closest('.group-head').dataset.gh); return; }
    const ghRen = e.target.closest('[data-gh-ren]');
    if (ghRen) { startGroupRename(ghRen.closest('.group-head'), ghRen.closest('.group-head').dataset.gh); return; }
    const ghNew = e.target.closest('[data-gh-new]');
    if (ghNew) { startGroupNewSub(ghNew.closest('.group-head'), ghNew.closest('.group-head').dataset.gh); return; }
    const ghAdd = e.target.closest('[data-gh-add]');
    if (ghAdd) {
      const cat = ghAdd.closest('.group-head').dataset.gh;
      openLinkDialog(null, cat && cat !== UNC ? cat : '');
    }
  });
}

/* ================= 书签弹窗 ================= */
function allCatPaths() {
  const set = new Set(state.categories);
  for (const l of state.links) set.add(catOf(l));
  return [...set].sort(zhSort);
}

function pickProfile() {
  if (state.profile !== '全部') return state.profile;
  const ps = profilesList();
  if (ps.length === 1) return ps[0].name;
  return '';
}

let acPop = null;
function closeAcPop() {
  if (acPop) { acPop.remove(); acPop = null; }
}
function showAcPop() {
  closeAcPop();
  const inp = $('#fCat');
  const v = inp.value.trim();
  const all = allCatPaths();
  const filtered = v ? all.filter((c) => c.toLowerCase().includes(v.toLowerCase())).slice(0, 30) : all.slice(0, 30);
  if (!filtered.length && !v) return;
  acPop = document.createElement('div');
  acPop.className = 'ac-pop';
  acPop.setAttribute('role', 'listbox');
  if (filtered.length) {
    for (const c of filtered) {
      const o = document.createElement('div');
      o.className = 'ac-item';
      o.setAttribute('role', 'option');
      o.textContent = c;
      o.addEventListener('mousedown', (e) => { e.preventDefault(); inp.value = c; closeAcPop(); });
      acPop.appendChild(o);
    }
  } else {
    const o = document.createElement('div');
    o.className = 'ac-item ac-new';
    o.textContent = `没有匹配的分类，直接回车就会新建「${v}」`;
    o.addEventListener('mousedown', (e) => e.preventDefault());
    acPop.appendChild(o);
  }
  document.body.appendChild(acPop);
  const r = inp.getBoundingClientRect();
  acPop.style.left = r.left + 'px';
  acPop.style.top = (r.bottom + 4) + 'px';
  acPop.style.minWidth = r.width + 'px';
  acPop.style.maxHeight = Math.max(120, window.innerHeight - r.bottom - 12) + 'px';
}

function openLinkDialog(link, prefillCat) {
  editId = link ? link.id : null;
  $('#fUrl').value = link ? link.url : '';
  $('#fTitle').value = link ? (link.title || '') : '';
  let cat = '';
  if (link) cat = catOf(link);
  else if (prefillCat != null) cat = prefillCat;
  else if (state.cat !== '全部' && state.cat !== UNC) cat = state.cat;
  $('#fCat').value = cat;
  $('#fTags').value = link ? (link.tags || []).join(', ') : '';
  $('#fNote').value = link ? (link.note || '') : '';
  $('#dlgLinkTitle').textContent = link ? '编辑书签' : '添加书签';
  $('#dlgLinkSubmit').textContent = link ? '保存修改' : '收进抽屉';
  $('#dlgLink').showModal();
  setTimeout(() => $('#fUrl').focus(), 30);
}

function wireLinkDialog() {
  const dlg = $('#dlgLink');
  const fCat = $('#fCat');
  fCat.addEventListener('focus', showAcPop);
  fCat.addEventListener('input', showAcPop);
  fCat.addEventListener('blur', () => setTimeout(closeAcPop, 120));
  dlg.addEventListener('close', closeAcPop);
  $('#linkForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const url = normalizeUrl($('#fUrl').value);
    if (!url) { toast('网址格式不正确'); return; }
    const payload = {
      url,
      title: $('#fTitle').value.trim(),
      category: $('#fCat').value.trim(),
      tags: $('#fTags').value.split(/[,，]/).map((s) => s.trim()).filter(Boolean),
      note: $('#fNote').value,
    };
    try {
      let r;
      if (editId) {
        r = await api('PUT', '/api/links/' + editId, payload);
      } else {
        payload.profile = pickProfile();
        payload.source = 'manual';
        r = await api('POST', '/api/links', payload);
      }
      dlg.close();
      if (r && r.duplicated) toast('这个网址已经在抽屉里了，已合并信息');
      await load();
    } catch (err) {
      if (err.readonly) { dlg.close(); return; }
      if (err.status === 400) toast('网址格式不正确');
      else toast('保存失败，检查本地服务');
    }
  });
}

}

/* ================= 导出 ================= */
function exportCatItems(profile) {
  const scope = profile === '全部' ? state.links : state.links.filter((l) => profileOf(l) === profile);
  const m = new Map();
  for (const l of scope) {
    const c = catOf(l);
    if (c !== UNC) m.set(c, (m.get(c) || 0) + 1);
  }
  const cats = [...m.keys()].sort(zhSort);
  return [{ value: '全部', label: '全部分类', count: scope.length }, ...cats.map((c) => ({ value: c, label: c, count: m.get(c) }))];
}

function openExportDialog() {
  const ps = profilesList();
  const profItems = [{ value: '全部', label: '全部资料', count: state.links.length }, ...ps.map((p) => ({ value: p.name, label: p.name, count: p.count }))];
  const defP = state.profile !== '全部' && ps.some((p) => p.name === state.profile) ? state.profile : '全部';
  const catItems0 = exportCatItems(defP);
  const defC = (state.cat !== '全部' && state.cat !== UNC && catItems0.some((i) => i.value === state.cat)) ? state.cat : '全部';

  if (expProfileDd) expProfileDd.close();
  if (expCatDd) expCatDd.close();
  $('#expProfileDd').innerHTML = '';
  $('#expCatDd').innerHTML = '';

  let curP = defP, curC = defC;
  const updateStats = () => {
    const n = state.links.filter((l) => inProfile(l) && (curC === '全部' || inCat(catOf(l), curC))).length;
    const pLabel = curP === '全部' ? '全部资料' : curP;
    const cLabel = curC === '全部' ? '全部分类' : curC;
    $('#expStats').textContent = `将导出 ${pLabel} / ${cLabel} 下的 ${n} 条书签。`;
  };
  expProfileDd = createDropdown({
    mount: $('#expProfileDd'),
    items: profItems,
    value: curP,
    onChange: (v) => {
      curP = v;
      curC = '全部';
      expCatDd.set(exportCatItems(v), curC);
      updateStats();
    },
  });
  expCatDd = createDropdown({
    mount: $('#expCatDd'),
    items: catItems0,
    value: curC,
    onChange: (v) => { curC = v; updateStats(); },
  });
  updateStats();
  $('#dlgExport').showModal();
}

function wireExportDialog() {
  $('#exportBtn').addEventListener('click', openExportDialog);
  $('#expCancel').addEventListener('click', () => $('#dlgExport').close());
  $('#expGo').addEventListener('click', () => {
    const p = expProfileDd.get();
    const c = expCatDd.get();
    const links = state.links.filter((l) => inProfile(l) && (c === '全部' || inCat(catOf(l), c)));
    const categories = [...new Set(links.map((l) => catOf(l)))].filter((x) => x !== UNC).sort(zhSort);
    const blob = new Blob([JSON.stringify({ links, categories }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `抽屉工作台-${p === '全部' ? '全部资料' : p}-${c === '全部' ? '全部分类' : c.replace(/\//g, '-')}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast(`已导出 ${links.length} 条书签`);
    $('#dlgExport').close();
  });
}

/* ================= 设置菜单 / 导入 / 清空 ================= */
function wireSettings() {
  const wrap = $('#settingsWrap');
  const menu = $('#settingsMenu');
  $('#settingsBtn').addEventListener('click', () => { menu.hidden = !menu.hidden; });
  document.addEventListener('mousedown', (e) => {
    if (!wrap.contains(e.target)) menu.hidden = true;
  });
  menu.addEventListener('click', async (e) => {
    const item = e.target.closest('[data-act]');
    if (!item) return;
    menu.hidden = true;
    const act = item.dataset.act;
    if (act === 'import') { $('#importFile').click(); return; }
    if (act === 'help') {
      toast('在 Chrome 每个个人资料里各装一份扩展（chrome://extensions 加载 extension 文件夹），并在扩展弹窗里给资料起名，收藏就会自动归到对应个人资料下');
      return;
    }
    if (act === 'clear-all') {
      if (!state.links.length) { toast('抽屉里没有收藏'); return; }
      if (!confirm(`确定删除全部 ${state.links.length} 条收藏？此操作不可撤销。`)) return;
      try {
        await api('DELETE', '/api/links');
        toast('已清空全部收藏');
        await load();
      } catch { toast('删除失败，检查本地服务'); }
      return;
    }
    if (act === 'clear-cat') {
      const cat = state.cat;
      if (cat === '全部' || cat === UNC) return;
      const n = state.links.filter((l) => catOf(l) === cat).length;
      if (!n) { toast(`「${cat}」里没有收藏`); return; }
      if (!confirm(`确定删除「${cat}」下的全部 ${n} 条收藏？此操作不可撤销。`)) return;
      try {
        await api('DELETE', '/api/links?category=' + encodeURIComponent(cat));
        toast(`已清空「${cat}」`);
        await load();
      } catch { toast('删除失败，检查本地服务'); }
      return;
    }
    if (act === 'clear-cats') {
      if (!state.categories.length) { toast('还没有分类'); return; }
      if (!confirm(`删除全部 ${state.categories.length} 个分类？收藏都会保留，统一移到「${UNC}」。`)) return;
      try {
        await api('DELETE', '/api/categories');
        state.categories = [];
        for (const l of state.links) l.category = UNC;
        state.cat = '全部';
        toast(`已清空所有分类，网址已归入「${UNC}」`);
        state.animate = true;
        render();
      } catch { toast('删除失败，检查本地服务'); }
    }
  });
  $('#importFile').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    if (state.readonly) {
      toast('只读快照：启动本地服务 node server.js 后才能修改');
      e.target.value = '';
      return;
    }
    let j;
    try { j = JSON.parse(await f.text()); } catch { toast('文件格式不对，需要 JSON'); e.target.value = ''; return; }
    const arr = Array.isArray(j) ? j : (j && Array.isArray(j.links) ? j.links : null);
    if (!arr) { toast('文件格式不对，需要 JSON'); e.target.value = ''; return; }
    let n = 0;
    for (const it of arr) {
      if (!it || !it.url) continue;
      try {
        await api('POST', '/api/links', {
          url: it.url,
          title: it.title || '',
          category: it.category || '',
          tags: Array.isArray(it.tags) ? it.tags : [],
          note: it.note || '',
          profile: it.profile || '',
          source: 'import',
        });
        n++;
      } catch {}
    }
    toast(`已导入 ${n} 个链接`);
    e.target.value = '';
    await load();
  });
}

/* ================= 工具条 / 键盘 ================= */
function wireTools() {
  $('#addBtn').addEventListener('click', () => openLinkDialog(null));
  const q = $('#q');
  q.addEventListener('input', () => {
    state.q = q.value;
    state.animate = true;
    render();
  });
  document.addEventListener('keydown', (e) => {
    const dlgOpen = document.querySelector('dialog[open]');
    const ae = document.activeElement;
    const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable);
    if (e.key === '/' && !dlgOpen && ae !== q && !typing) {
      e.preventDefault();
      q.focus();
    }
    if (e.key === 'Escape' && !dlgOpen && state.q) {
      const inSide = ae && ae.closest && ae.closest('.side-item');
      const inGroup = ae && ae.closest && ae.closest('.group-head');
      if (!inSide && !inGroup) {
        state.q = '';
        q.value = '';
        state.animate = true;
        render();
      }
    }
  });
}

/* ================= 启动 ================= */
$$('dialog .dlg-foot [data-close]').forEach((b) => {
  b.addEventListener('click', () => b.closest('dialog').close());
});
wireNav();
wireMain();
wireDrag();
wireTools();
wireSettings();
wireLinkDialog();
wireProfileDialog();
wireExportDialog();
load();
</script>
